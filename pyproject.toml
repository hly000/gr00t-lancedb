[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gr00t-lancedb"
version = "0.1.0"
description = "Zero-download S3 streaming, modality.json adaptation, and exact Spot-preemption resume for NVIDIA Isaac-GR00T on LanceDB"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "gr00t-lancedb contributors" }]
keywords = ["robotics", "gr00t", "lerobot", "lancedb", "vla", "spot-training", "s3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "lerobot-lancedb>=0.3.0",
    "lancedb>=0.42.0b26",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "torch>=2.1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.28"]
gcs = ["gcsfs>=2024.2"]
cloud = ["boto3>=1.28", "gcsfs>=2024.2"]
dev = ["pytest>=8.0", "moto[server]>=5.0", "av>=12.0"]
vision = ["transformers>=4.40"]
plots = ["matplotlib>=3.7"]

[project.scripts]
gr00t-lance-convert = "gr00t_lancedb.convert:main_convert"
gr00t-lance-attach = "gr00t_lancedb.convert:main_attach"
gr00t-lance-curate = "gr00t_lancedb.curate:main_curate"
gr00t-lance-vector-curate = "gr00t_lancedb.vector_curate:main_vector_curate"
gr00t-spot-bench = "gr00t_lancedb.bench.cli:main"
gr00t-lance-flywheel = "gr00t_lancedb.flywheel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
